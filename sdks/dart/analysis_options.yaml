# Generated UniFFI bindings under lib/src/rust/ are excluded from analysis: they are
# machine-generated by uniffi-bindgen-dart and are not hand-authored source. Regenerate
# with ./build_dart.sh; do not hand-edit.
#
# NOTE (uniffi-bindgen-dart 0.1.3 limitation): the generator currently emits
# type-incorrect Dart for async constructors and foreign-callback methods, so the
# FrfFfiClient *transport* surface (connect / subscribe-with-callback) does not yet
# type-check. The synchronous CRDT functions generate correctly. See GENERATED.md.
analyzer:
  exclude:
    - lib/src/rust/**
