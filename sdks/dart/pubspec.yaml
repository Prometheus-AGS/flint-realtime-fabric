name: frf_dart
description: Dart/Flutter SDK for Flint Realtime Fabric — generated from the Rust UniFFI crate (frf-ffi) via uniffi-bindgen-dart.
version: 0.1.0
homepage: https://github.com/prometheusags/flint-realtime-fabric

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  # dart:ffi bindings support. The UniFFI bindings (uniffi-bindgen-dart) are NOT a pub
  # dependency — they are generated by the cargo `uniffi-bindgen-dart` tool (see
  # build_dart.sh / GENERATED.md), not flutter_rust_bridge.
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  ffigen: ^12.0.0
