# Flint Gate — dev compose configuration for Stage 10 integration tests.
# NOT for production. The JWT signing secret is intentionally weak and well-known.

server:
  listen: "0.0.0.0:4456"
  admin_listen: "0.0.0.0:4457"
  tls:
    enabled: false

database:
  url: "postgres://frf:frf@postgres:5432/frf"
  max_connections: 5
  override_yaml: false

cache:
  l1:
    max_capacity: 1000
    ttl_seconds: 30

jwt:
  signing_algorithm: "HS256"
  # Signing secret is NOT stored here. It is supplied via the FLINT_GATE_JWT_SECRET
  # environment variable, which overrides this field (see flint-gate main.rs). Prod
  # requires it (compose.yml fails fast if unset); dev provides it via the override.
  signing_key_secret: null
  issuer: "flint-gate-dev"
  default_ttl_seconds: 3600

auth_providers:
  dev_passthrough:
    type: anonymous
    default_subject: "dev-integration"

sites:
  - id: "frf-dev"
    domains:
      - "localhost"
      - "gateway"
    default_auth: dev_passthrough
    default_upstream: "http://gateway:8080"

routes:
  - id: "frf-all"
    site: "frf-dev"
    match:
      path: "/**"
      methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS"]
    upstream: "http://gateway:8080"
    auth: dev_passthrough
    priority: 1
    hooks:
      pre_request:
        - type: claims_enhancement
          config:
            inject_headers:
              X-Dev-Integration: "true"
            mint_jwt:
              enabled: true
              additional_claims:
                tenant_id: "00000000-0000-0000-0000-000000000001"
                sub: "dev-integration-user"
