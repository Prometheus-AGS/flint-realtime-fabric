events {}

http {
  server_tokens off;
  server {
    listen 8443 ssl;
    ssl_certificate /run/tls/tls.crt;
    ssl_certificate_key /run/tls/tls.key;
    ssl_trusted_certificate /run/tls/ca.crt;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /healthz { proxy_pass http://gateway:8080; }
    location = /readyz { proxy_pass http://gateway:8080; }
    location = /metrics { proxy_pass http://gateway:8080; }
    location = /v1/publish { proxy_pass http://gateway:8080; }
    location = /ws/v1/subscribe {
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_pass http://gateway:8080;
    }
    location / { return 404; }
  }

  server {
    listen 9443 ssl http2;
    ssl_certificate /run/tls/tls.crt;
    ssl_certificate_key /run/tls/tls.key;
    ssl_trusted_certificate /run/tls/ca.crt;
    ssl_protocols TLSv1.2 TLSv1.3;

    location ~ ^/flint\.v1\.(SpineService|SyncService|EntityService)/ {
      grpc_pass grpc://gateway:9090;
    }
    location / { return 404; }
  }
}
