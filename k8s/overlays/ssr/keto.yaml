apiVersion: apps/v1
kind: Deployment
metadata:
  name: frf-keto
  labels:
    app.kubernetes.io/name: frf-keto
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frf-keto
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frf-keto
    spec:
      serviceAccountName: frf-keto
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keto
          image: oryd/keto:v0.14.0@sha256:c209da1c2f0f764f5790ef688ecb723141a84692dd6d9ab8c5bbefc3ead7838a
          args: ["serve", "-c", "/etc/config/keto/keto.yml"]
          env:
            - name: DSN
              valueFrom:
                secretKeyRef:
                  name: frf-keto-database
                  key: url
          ports:
            - name: read
              containerPort: 4466
            - name: write
              containerPort: 4467
          startupProbe:
            httpGet:
              path: /health/ready
              port: read
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/alive
              port: read
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: read
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/config/keto
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: frf-keto-config
---
apiVersion: v1
kind: Service
metadata:
  name: frf-keto-read
  labels:
    app.kubernetes.io/name: frf-keto
    app.kubernetes.io/component: read
spec:
  selector:
    app.kubernetes.io/name: frf-keto
  ports:
    - name: read
      port: 4466
      targetPort: read
---
apiVersion: v1
kind: Service
metadata:
  name: frf-keto-write
  labels:
    app.kubernetes.io/name: frf-keto
    app.kubernetes.io/component: write
  annotations:
    prometheusags.ai/exposure: private-cluster-only
spec:
  selector:
    app.kubernetes.io/name: frf-keto
  ports:
    - name: write
      port: 4467
      targetPort: write
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frf-keto
automountServiceAccountToken: false
