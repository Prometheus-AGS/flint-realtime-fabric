apiVersion: apps/v1
kind: Deployment
metadata:
  name: frf-gateway
  labels:
    app.kubernetes.io/name: frf-gateway
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: frf-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frf-gateway
    spec:
      serviceAccountName: frf-gateway
      imagePullSecrets:
        - name: ghcr-pull
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: frf-gateway
      containers:
        - name: gateway
          image: ghcr.io/prometheus-ags/flint-realtime-fabric@sha256:4da5f05de5877e84c8dcaec5c78f7af02e00454138c5390f5d545c3aeae0f915
          imagePullPolicy: IfNotPresent
          env:
            - name: BIND_ADDR
              value: 0.0.0.0:8080
            - name: GRPC_PORT
              value: "9090"
            - name: IGGY_CONNECTION_STRING
              value: iggy://iggy:iggy@frf-iggy:8090
            - name: AUTHZ_BACKEND
              value: verified-identity
            - name: GATEWAY_JWKS_URL
              value: http://flint-gate-proxy:4456/.well-known/jwks.json
            - name: JWT_AUDIENCE
              value: frf-gateway
            - name: JWT_ISSUER
              value: https://workspace-ssr.prometheusags.ai/flint-gate
            - name: SFU_MODE
              value: sovereign
            - name: CDC_ENABLED
              value: "false"
            - name: FEDERATION_ENABLED
              value: "false"
            - name: POLICY_ENGINE
              value: none
            - name: CORS_ALLOWED_ORIGINS
              value: https://workspace-ssr.prometheusags.ai
            - name: RUST_LOG
              value: info
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 4
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 1
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes: []
---
apiVersion: v1
kind: Service
metadata:
  name: frf-gateway
  labels:
    app.kubernetes.io/name: frf-gateway
spec:
  selector:
    app.kubernetes.io/name: frf-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9090
      targetPort: grpc
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frf-gateway
automountServiceAccountToken: false
