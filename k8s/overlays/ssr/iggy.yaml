apiVersion: v1
kind: Service
metadata:
  name: frf-iggy
  labels:
    app.kubernetes.io/name: frf-iggy
spec:
  selector:
    app.kubernetes.io/name: frf-iggy
  ports:
    - name: tcp
      port: 8090
      targetPort: tcp
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: frf-iggy
  labels:
    app.kubernetes.io/name: frf-iggy
    prometheusags.ai/backup-required: "true"
  annotations:
    prometheusags.ai/backup-policy: daily-7d
    prometheusags.ai/restore-runbook: docs/deployment/stateful-restore.md
spec:
  serviceName: frf-iggy
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frf-iggy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frf-iggy
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: iggy
          image: iggyrs/iggy@sha256:68a314c1380be5a792a134f3bd346ded42bd49d9f7114c86f70b48fc85bc5272
          imagePullPolicy: IfNotPresent
          env:
            - name: IGGY_SYSTEM_PATH
              value: /data
          ports:
            - name: tcp
              containerPort: 8090
          startupProbe:
            tcpSocket:
              port: tcp
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: tcp
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: tcp
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          prometheusags.ai/backup-required: "true"
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: managed-csi
        resources:
          requests:
            storage: 10Gi
