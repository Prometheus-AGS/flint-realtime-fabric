apiVersion: batch/v1
kind: Job
metadata:
  name: frf-keto-migrate-v0140
  labels:
    app.kubernetes.io/name: frf-keto-migrate
    prometheusags.ai/migration-version: "0.14.0"
  annotations:
    prometheusags.ai/migration-marker: ory-keto-sql-migrations
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frf-keto-migrate
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: oryd/keto:v0.14.0@sha256:c209da1c2f0f764f5790ef688ecb723141a84692dd6d9ab8c5bbefc3ead7838a
          args: ["migrate", "up", "-c", "/etc/config/keto/keto.yml", "-y"]
          env:
            - name: DSN
              valueFrom:
                secretKeyRef:
                  name: frf-keto-database
                  key: url
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/config/keto
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: frf-keto-config
