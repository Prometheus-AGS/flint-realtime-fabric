apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frf-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: sansaba-workspace
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frf-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: frf-gateway
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: flint-gate
      ports:
        - port: 8080
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sansaba-workspace
      ports:
        - port: 9090
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: frf-iggy
      ports:
        - port: 8090
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: frf-keto
      ports:
        - port: 4466
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: flint-gate
      ports:
        - port: 4456
          protocol: TCP
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frf-keto-jobs
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["frf-keto-migrate", "frf-keto-seed"]
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: frf-keto-postgres
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: frf-keto
      ports:
        - port: 4467
          protocol: TCP
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frf-iggy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: frf-iggy
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: frf-gateway
      ports:
        - port: 8090
          protocol: TCP
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frf-keto
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: frf-keto
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: frf-gateway
      ports:
        - port: 4466
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: frf-keto-seed
      ports:
        - port: 4467
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: frf-keto-postgres
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frf-keto-postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: frf-keto-postgres
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["frf-keto", "frf-keto-migrate"]
      ports:
        - port: 5432
          protocol: TCP
  egress: []
