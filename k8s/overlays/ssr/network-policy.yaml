apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frf-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: sansaba-workspace
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frf-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: frf-gateway
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: flint-gate
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: flint-gate
      ports:
        - port: 4456
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: electric
      ports:
        - port: 3000
          protocol: TCP
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
