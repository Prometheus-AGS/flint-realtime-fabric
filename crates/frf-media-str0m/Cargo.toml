[package]
name = "frf-media-str0m"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Sovereign WebRTC SFU signaling adapter using str0m for Flint Realtime Fabric"

[lints]
workspace = true

[dependencies]
frf-domain = { path = "../frf-domain" }
frf-ports = { path = "../frf-ports" }
str0m = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "net", "time", "macros"] }
tokio-stream = { workspace = true, features = ["sync"] }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
dashmap = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }
# Timestamps on outbound trickle-ICE / state SignalEnvelopes built in the session engine.
# Also used by the sfu.rs / session.rs unit tests to build SignalEnvelope fixtures.
chrono = { workspace = true }
