name: Documentation site

# Mirrors prometheus-entity-management's docs-pages.yml: least-privilege
# permissions, SHA-pinned actions, serialized deploys, and a deploy job that
# only a push to main can reach. A pull request builds the site but can never
# publish it and leaves no deployable artifact behind.

on:
  pull_request:
    paths:
      - "website/**"
      - "docs/**"
      - "README.md"
      - "website/package-lock.json"
      - ".github/workflows/docs-pages.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # showLastUpdateTime reads git history; a shallow clone dates every
          # page to the checkout.
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install the locked dependencies
        run: npm ci
        working-directory: website

      # NOTE: this builds and inspects the documentation site. It does not run
      # tests — this project's policy is local integration testing only, and CI
      # runs build, lint, typecheck, format and packaging gates exclusively.
      #
      # `npm run build` runs the sanitizer first (it rejects machine-local
      # paths, secrets and raw wiki content), then `docusaurus build`, which
      # fails on a broken link because onBrokenLinks is "throw".
      - name: Build the production site
        run: npm run build
        working-directory: website

      - name: Reject private material in the output
        run: |
          if grep -rIlE '/Users/|\.prometheus/|BEGIN .*PRIVATE KEY' build; then
            echo "private material found in site output" >&2
            exit 1
          fi
          echo "no private material in build output"
        working-directory: website

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload the Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: website/build

  deploy:
    # A pull request cannot reach this job: `event_name == 'push'` excludes
    # pull_request events, and the ref check restricts it to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy the Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
