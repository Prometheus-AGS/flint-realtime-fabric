packages:
  - sdks/ts
  - sdks/entity-management
  - admin-ui
allowBuilds:
  # core-js's postinstall only prints a funding banner; it builds nothing.
  # @swc/core is the Rust compiler behind @docusaurus/faster; it needs its
  # postinstall to place the correct native binary.
  '@swc/core': true
  core-js: false
  esbuild: true
