[workspace]
resolver = "2"
members = [
    "crates/frf-domain",
    "crates/frf-ports",
    "crates/frf-agentproto",
    "crates/frf-librefang",
    "crates/frf-proto",
    "crates/frf-sdk-rust",
    "crates/frf-cli",
    "crates/frf-gateway",
    "crates/frf-app",
    "crates/frf-broker-iggy",
    "crates/frf-authz-keto",
    "crates/frf-identity-ory",
    "crates/frf-postgres-cdc",
    "crates/frf-crdt",
    "crates/frf-p2p",
    "crates/frf-did",
    "crates/frf-wallet",
    "crates/frf-store-redb",
    "crates/frf-store-surreal",
    "crates/frf-ffi",
    "crates/frf-media-livekit",
    "crates/frf-media-str0m",
    "crates/frf-wasm",
    "crates/frf-bridge-matrix",
    "crates/frf-bridge-atproto",
    "crates/frf-policy-cedar",
    "crates/uniffi-bindgen",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/prometheusags/flint-realtime-fabric"
rust-version = "1.94"

# Centralized lint policy — every crate opts in via `[lints] workspace = true`.
# `unwrap_used` is the CLAUDE.md hard gate: no unwrap()/expect() in library code.
# It is a `restriction`-group lint (not covered by `pedantic`), so it must be
# named explicitly. clippy skips `#[cfg(test)]` code automatically, so tests may
# still use unwrap()/expect() freely.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
# Web / gateway
axum = { version = "0.8.8", features = ["ws", "macros"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-br", "limit"] }
tower_governor = "0.8"
rust-embed = "8"
mime_guess = "2"

# Async runtime
tokio = { version = "1.52", features = ["full"] }
tokio-stream = "0.1"

# gRPC / proto
tonic = { version = "0.14", features = ["transport", "tls-ring"] }
tonic-web = "0.14"
prost = "0.14"
prost-types = "0.14"

# Actors
ractor = "0.15"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Bytes / networking
bytes = "1.11"
http = "1.2"

# Error handling
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4", features = ["derive", "env"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = { version = "0.27", features = ["trace"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.28"

# IDs / time
uuid = { version = "1.23", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Concurrency
dashmap = "6"

# Async utilities
async-stream = "0.3"
futures-util = "0.3"
async-trait = "0.1"

# Peer-to-peer transport (frf-p2p).
# iroh 1.0 guarantees wire-protocol stability: any v1 endpoint interoperates
# with any other v1 endpoint regardless of minor version or language binding.
# An endpoint's id IS its Ed25519 public key, which is what lets frf-did derive
# a did:key from it with no extra key material.
iroh = "1.0"
# base58btc for did:key multibase encoding (frf-did). Already in the tree via
# iroh, so this adds no new dependency footprint.
bs58 = "0.5"
# mDNS discovery moved OUT of the iroh crate in 1.0 — the 0.9x
# `discovery-local-network` feature no longer exists. This is the official
# n0-computer replacement (MIT OR Apache-2.0).
iroh-mdns-address-lookup = "0.4"
n0-error = "1.0"

# HTTP / WebSocket clients
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

# JWT / identity
jsonwebtoken = "9"

# Postgres replication
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
pg_walstream = "0.6"

# Test utilities
mockall = "0.13"
httpmock = "0.7"
criterion = { version = "0.5", features = ["html_reports"] }

# Event spine (GQAdonis fork). Keep the SDK on the exact source revision used
# by the pinned server-0.4.214 image; newer SDKs issue commands that this
# kernel-compatible server does not implement.
iggy = { git = "https://github.com/GQAdonis/iggy", rev = "d34b9c96ad5a15334e06040d68fd7512beeba4c8" }

# Phase 3: CRDT + offline persistence + FFI
loro = { version = "1.13.1" }

# Phase 7: sovereign SFU
str0m = { version = "0.21" }

# Phase 8: Cedar policy engine
cedar-policy = { version = "4" }
loro-ffi = { version = "1.13.1" }
redb = { version = "4.1.0" }
surrealdb = { version = "3.1.5" }
uniffi = { version = "0.31.2" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
