name: flint-realtime-fabric-full

# Production-shaped full data profile. Render it through
# scripts/render-deployment-profile.sh so immutable image, TLS, identity and
# secret inputs are validated before Compose sees them.
services:
  edge:
    image: "${FRF_TLS_PROXY_IMAGE:?FRF_TLS_PROXY_IMAGE must be an image digest}"
    ports:
      - "${FRF_HTTPS_BIND_IP:-127.0.0.1}:${FRF_HTTPS_PORT:-8443}:8443"
      - "${FRF_HTTPS_BIND_IP:-127.0.0.1}:${FRF_GRPC_HTTPS_PORT:-9443}:9443"
    volumes:
      - ./deploy/profiles/nginx-full.conf:/etc/nginx/nginx.conf:ro
      - "${FRF_TLS_CERT_FILE:?FRF_TLS_CERT_FILE is required}:/run/tls/tls.crt:ro"
      - "${FRF_TLS_KEY_FILE:?FRF_TLS_KEY_FILE is required}:/run/tls/tls.key:ro"
      - "${FRF_TLS_CA_FILE:?FRF_TLS_CA_FILE is required}:/run/tls/ca.crt:ro"
    depends_on:
      gateway:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    networks: [edge]

  gateway:
    image: "${FRF_FULL_GATEWAY_IMAGE:?FRF_FULL_GATEWAY_IMAGE must be an image digest}"
    expose: ["8080", "9090"]
    environment:
      GATEWAY_PROFILE: full
      BIND_ADDR: 0.0.0.0:8080
      GRPC_PORT: "9090"
      IGGY_CONNECTION_STRING: "iggy://${FRF_IGGY_USERNAME:?FRF_IGGY_USERNAME is required}:${FRF_IGGY_PASSWORD:?FRF_IGGY_PASSWORD is required}@iggy:8090"
      AUTHZ_BACKEND: keto
      KETO_BASE_URL: http://keto:4466
      KETO_NAMESPACE: "${FRF_KETO_NAMESPACE:-default}"
      GATEWAY_JWKS_URL: http://flint-gate:4456/.well-known/jwks.json
      JWT_AUDIENCE: "${FRF_JWT_AUDIENCE:?FRF_JWT_AUDIENCE is required}"
      JWT_ISSUER: "${FRF_JWT_ISSUER:?FRF_JWT_ISSUER is required}"
      MEDIA_ENABLED: "false"
      AGENT_ENABLED: "false"
      ADMIN_ENABLED: "false"
      CDC_ENABLED: "${FRF_CDC_ENABLED:-false}"
      CDC_REPLICATION_URL: "postgres://${FRF_POSTGRES_USER:?FRF_POSTGRES_USER is required}:${FRF_POSTGRES_PASSWORD:?FRF_POSTGRES_PASSWORD is required}@postgres:5432/${FRF_POSTGRES_DB:?FRF_POSTGRES_DB is required}"
      CDC_SLOT_NAME: "${FRF_CDC_SLOT_NAME:-frf_slot}"
      CDC_PUBLICATION_NAME: "${FRF_CDC_PUBLICATION_NAME:-frf_pub}"
      CDC_TENANT_ID: "${FRF_CDC_TENANT_ID:-}"
      CDC_CHANNEL_PATH: "${FRF_CDC_CHANNEL_PATH:-entities}"
      CDC_SOURCE_EPOCH: "${FRF_CDC_SOURCE_EPOCH:-}"
      CDC_ENROLLMENTS_JSON: "${FRF_CDC_ENROLLMENTS_JSON:-[]}"
      ENTITY_PROJECTION_URL: ws://surreal:8000
      ENTITY_PROJECTION_USERNAME: "${FRF_SURREAL_USERNAME:?FRF_SURREAL_USERNAME is required}"
      ENTITY_PROJECTION_PASSWORD: "${FRF_SURREAL_PASSWORD:?FRF_SURREAL_PASSWORD is required}"
      ENTITY_PROJECTION_NAMESPACE: "${FRF_SURREAL_NAMESPACE:-flint}"
      ENTITY_PROJECTION_DATABASE: "${FRF_SURREAL_DATABASE:-entity_projection}"
      ENTITY_WATCH_CHECKPOINT_KEY: "${FRF_ENTITY_WATCH_CHECKPOINT_KEY:-}"
      ENTITY_WATCH_CHECKPOINT_GENERATION: "${FRF_ENTITY_WATCH_CHECKPOINT_GENERATION:-1}"
      ENTITY_WATCH_RETENTION_SECONDS: "${FRF_ENTITY_WATCH_RETENTION_SECONDS:-86400}"
      ENTITY_WATCH_BUFFER_CAPACITY: "${FRF_ENTITY_WATCH_BUFFER_CAPACITY:-256}"
      FEDERATION_ENABLED: "false"
      POLICY_ENGINE: cedar
      CORS_ALLOWED_ORIGINS: "${FRF_PUBLIC_ORIGIN:?FRF_PUBLIC_ORIGIN is required}"
      RUST_LOG: "${RUST_LOG:-info}"
    depends_on:
      flint-gate:
        condition: service_started
      iggy:
        condition: service_healthy
      keto:
        condition: service_healthy
      postgres:
        condition: service_healthy
      surreal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s
    networks: [edge, control, data]

  iggy:
    image: "${FRF_IGGY_IMAGE:?FRF_IGGY_IMAGE must be an image digest}"
    expose: ["8090"]
    environment:
      IGGY_SYSTEM_PATH: /data
      IGGY_ROOT_USERNAME: "${FRF_IGGY_USERNAME}"
      IGGY_ROOT_PASSWORD: "${FRF_IGGY_PASSWORD}"
    volumes:
      - iggy-data:/data
    healthcheck:
      test: ["CMD-SHELL", "iggy --transport tcp --server-address 127.0.0.1:8090 me >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks: [data]

  keto-migrate:
    image: "${FRF_KETO_IMAGE:?FRF_KETO_IMAGE must be an image digest}"
    command: migrate up -c /etc/config/keto/keto.yml -y
    volumes:
      - ./deploy/keto:/etc/config/keto:ro
    restart: "no"
    networks: [control]

  keto:
    image: "${FRF_KETO_IMAGE}"
    command: serve -c /etc/config/keto/keto.yml
    expose: ["4466", "4467"]
    volumes:
      - ./deploy/keto:/etc/config/keto:ro
    depends_on:
      keto-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4466/health/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks: [control]

  flint-gate:
    image: "${FLINT_GATE_IMAGE:?FLINT_GATE_IMAGE must be an image digest}"
    expose: ["4456", "4457"]
    environment:
      DATABASE_URL: "postgres://${FRF_POSTGRES_USER}:${FRF_POSTGRES_PASSWORD}@postgres:5432/${FRF_POSTGRES_DB}"
      FLINT_GATE_CONFIG: /run/config/flint-gate.yaml
      FLINT_GATE_REQUIRE_DATABASE: "true"
      FLINT_GATE_JWT_KEY_PATH: /run/secrets/flint-gate/private.pem
      RUST_LOG: "${RUST_LOG:-info}"
    volumes:
      - "${FLINT_GATE_CONFIG_FILE:?FLINT_GATE_CONFIG_FILE is required}:/run/config/flint-gate.yaml:ro"
      - "${FLINT_GATE_JWT_PRIVATE_KEY_FILE:?FLINT_GATE_JWT_PRIVATE_KEY_FILE is required}:/run/secrets/flint-gate/private.pem:ro"
    depends_on:
      flint-gate-db-init:
        condition: service_completed_successfully
    networks: [control, data]

  flint-gate-db-init:
    image: "${FLINT_GATE_IMAGE}"
    command: ["--database-init-only"]
    environment:
      DATABASE_URL: "postgres://${FRF_POSTGRES_USER}:${FRF_POSTGRES_PASSWORD}@postgres:5432/${FRF_POSTGRES_DB}"
      FLINT_GATE_CONFIG: /run/config/flint-gate.yaml
      FLINT_GATE_JWT_KEY_PATH: /run/secrets/flint-gate/private.pem
      FLINT_GATE_JWT_PUBLIC_KEY_PATH: /run/secrets/flint-gate/public.pem
    volumes:
      - "${FLINT_GATE_CONFIG_FILE}:/run/config/flint-gate.yaml:ro"
      - "${FLINT_GATE_JWT_PRIVATE_KEY_FILE}:/run/secrets/flint-gate/private.pem:ro"
      - "${FLINT_GATE_JWT_PUBLIC_KEY_FILE:?FLINT_GATE_JWT_PUBLIC_KEY_FILE is required}:/run/secrets/flint-gate/public.pem:ro"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [data]

  postgres:
    image: "${FRF_POSTGRES_IMAGE:?FRF_POSTGRES_IMAGE must be an image digest}"
    expose: ["5432"]
    environment:
      POSTGRES_USER: "${FRF_POSTGRES_USER}"
      POSTGRES_PASSWORD: "${FRF_POSTGRES_PASSWORD}"
      POSTGRES_DB: "${FRF_POSTGRES_DB}"
    command: postgres -c wal_level=logical -c max_replication_slots=5 -c max_wal_senders=5
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks: [control, data]

  surreal:
    image: "${FRF_SURREAL_IMAGE:?FRF_SURREAL_IMAGE must be an image digest}"
    command: ["start", "--log", "info"]
    environment:
      SURREAL_USER: "${FRF_SURREAL_USERNAME}"
      SURREAL_PASS: "${FRF_SURREAL_PASSWORD}"
      SURREAL_PATH: rocksdb:/data/entity-projection
    expose: ["8000"]
    volumes:
      - surreal-data:/data
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "ws://localhost:8000"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks: [data]

networks:
  edge: {}
  control:
    internal: true
  data:
    internal: true

volumes:
  iggy-data: {}
  postgres-data: {}
  surreal-data: {}
